name: RadiateBenchmark
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.1
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
targets:
  RadiateMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryan.radiate.benchmark.mac
        PRODUCT_NAME: Radiate
        PRODUCT_MODULE_NAME: RadiateMac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/RadiateMac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/RadiateMac.entitlements
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    scheme:
      testTargets:
        - RadiateMacTests

  RadiateReceiver:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryan.radiate.benchmark.receiver
        PRODUCT_NAME: Radiate Receiver
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/RadiateReceiver-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/RadiateReceiver.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"

  RadiateMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SharedTests
    dependencies:
      - target: RadiateMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryan.radiate.benchmark.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Radiate.app/Contents/MacOS/Radiate
        BUNDLE_LOADER: $(TEST_HOST)
